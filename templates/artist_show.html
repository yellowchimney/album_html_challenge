<!DOCTYPE html>
<html lang="en">
  <head>
    <title>{{artist.name}}</title>
    <meta charset="utf-8">
  </head>
  <body>
    <h1>{{artist.name}}</h1>
    <p class="t-genre">Genre: {{artist.genre}}</p>
    <p> Albums: </p>
    <ul>
        {% for album in albums %}
          <li>
            <a href="/albums/{{album.id}}">{{album.title}}</a>
          </li>
        {% endfor %}
    </ul>


    <!-- This is a link to another page. -->
    <!-- The browser will send `GET /albums` when the user clicks this -->
    <a href="/artists">Back to all artists</a>
  </body>
</html>
